# Deploy the KLA-Sync public static site to GitHub Pages.
#
# The site is plain HTML/CSS/JS with no build step. A staging directory is
# assembled from only the public files so internal reference code, migrations,
# tests, and documentation source never get served as site content.
name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "404.html"
      - "assets/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

# Minimum permissions required for Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel a deployment already in progress.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Assemble, verify and deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble public site directory
        run: |
          set -euo pipefail
          mkdir -p _site/assets
          cp index.html 404.html _site/
          cp -R assets/css assets/js _site/assets/
          echo "Staged site contents:"
          find _site -type f | sort

      - name: Verify referenced assets exist (no broken local links)
        run: |
          set -euo pipefail
          cd _site
          grep -hEo '(src|href)="[^"#]+"' index.html 404.html \
            | sed -E 's/^(src|href)="//; s/"$//' \
            | grep -v -E '^(https?:)?//' \
            | grep -v -E '^data:' \
            | sort -u \
            | while read -r ref; do
                if [ ! -e "$ref" ]; then
                  echo "::error::Missing referenced file: $ref"
                  exit 1
                fi
                echo "ok: $ref"
              done

      - name: Secret-hygiene scan (no credentials in published site)
        run: |
          set -euo pipefail
          cd _site
          if grep -rInE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY|postgresql://[^ ]+:[^ ]+@|(api[_-]?key|secret|password|token)(["'\"'"]?\s*[:=]\s*)["'\"'"][^"'\"'"]{8,}' . ; then
            echo "::error::Potential secret/credential pattern found in published site."
            exit 1
          fi
          echo "No credential patterns found."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
