<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KLA-Sync — Uganda Music Monitoring</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: #f8fafc;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top right, #334155 0, transparent 35%),
        #0b1020;
    }

    main {
      max-width: 760px;
      padding: 48px 28px;
      text-align: center;
    }

    .tag {
      color: #86efac;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 16px 0;
      font-size: clamp(2.5rem, 9vw, 5rem);
    }

    p {
      color: #cbd5e1;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 22px;
      padding: 13px 20px;
      border-radius: 999px;
      background: #22c55e;
      color: #052e16;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="tag">Uganda music intelligence</div>
    <h1>KLA-Sync</h1>
    <p>
      An offline-tolerant platform for music monitoring, robust audio
      fingerprinting, royalty attribution, and transparent creator payouts.
    </p>
    <a href="https://github.com/mikeo-ne/ugsync">View the project</a>
  </main>
</body>
</html>
