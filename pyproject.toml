[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kla-sync"
version = "0.1.0"
description = "Offline-tolerant music monitoring, fingerprinting, and royalty attribution primitives for Uganda."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [{name = "KLA-Sync"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = []

[project.optional-dependencies]
production = [
  "numpy>=1.26",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
  "elasticsearch>=8.0",
  "httpx>=0.27",
]
dev = ["pglast>=6.0", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kla-sync = "kla_sync.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
